name: Mac bundle and installer checks

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    tags: ['macos-v*']
    paths: ['macos/**', 'src/**', 'shared/**', 'scripts/**', 'package*.json', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'src/**', 'shared/**', 'scripts/**', 'package*.json', '.github/workflows/macos.yml']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [arm64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Keep the connected owner build working
        if: matrix.architecture == 'arm64'
        run: |
          npm run macos:build
          npm run macos:verify
      - name: Build and verify the public local-only installer
        run: npm run macos:package -- --arch ${{ matrix.architecture }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apply-vigil-macos-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            output/releases/*.dmg
            output/releases/*.zip
            output/releases/SHA512SUMS.txt
            output/releases/release.json
          retention-days: 14
          if-no-files-found: error

# Native GUI smoke tests run locally with npm run macos:test. This workflow
# validates the compiled bundle without requiring an interactive WindowServer.
# This public repository has public build artifacts. Only code and generated
# assets belong in them. Publishing a release remains a separate reviewed step.
